[versions]
kotlin = "2.4.0"
exposed = "1.3.1"
logback = "1.5.37"

mariadb = "3.5.10"
hikari = "7.1.0"
valiktor = "0.12.0"
jbcrypt = "0.4"
jakarta-mail = "2.0.5"
dotenv = "6.5.1"

[libraries]
exposed-core = { module = "org.jetbrains.exposed:exposed-core", version.ref = "exposed" }
exposed-jdbc = { module = "org.jetbrains.exposed:exposed-jdbc", version.ref = "exposed" }
exposed-dao = { module = "org.jetbrains.exposed:exposed-dao", version.ref = "exposed" }
exposed-kotlin-datetime = { module = "org.jetbrains.exposed:exposed-kotlin-datetime", version.ref = "exposed" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }

mariadb-java-client = { group = "org.mariadb.jdbc", name = "mariadb-java-client", version.ref = "mariadb" }
hikari-cp = { group = "com.zaxxer", name = "HikariCP", version.ref = "hikari" }
valiktor-core = { module = "org.valiktor:valiktor-core", version.ref = "valiktor" }
security-bcrypt = { module = "org.mindrot:jbcrypt", version.ref = "jbcrypt" }
jakarta-mail = { group = "org.eclipse.angus", name = "jakarta.mail", version.ref = "jakarta-mail" }
dotenv-kotlin = { module = "io.github.cdimascio:dotenv-kotlin", version.ref = "dotenv" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
