{% extends "layouts/auth.html" %}

{% block content %}
<div class="container mt-5" style="max-width: 420px">
    <div class="card shadow-sm">
        <div class="card-body">
            <h4 class="card-title mb-3 text-center">
                Change Password
            </h4>
            {% if fromReset %}
            <div class="alert alert-info">
                Anda sudah login.
                Demi keamanan, reset password via email tidak diizinkan.
                Silakan ganti password Anda di sini.
            </div>
            {% endif %}
            <div id="form-container">
                {% include "pages/auth/fragments/change-password-form.html" %}
            </div>
        </div>
    </div>
</div>

{% endblock %}
