<!-- Nama -->
<div class="row mb-3">

    <label
            for="my-name"
            class="col-sm-4 col-form-label">

        Nama

    </label>

    <div class="col-sm-8">

        <input
                type="text"
                id="my-name"
                name="nama"
                class="form-control {% if errors.nama %}is-invalid{% endif %}"
                value="{{ formData.nama | default('') }}"
                placeholder="Nama">

        {% if errors.nama %}

        <div class="invalid-feedback">

            {{ errors.nama }}

        </div>

        {% endif %}

    </div>

</div>
