{% extends "layouts/app.html" %}

{% block content %}
<div class="row">
    <div class="col-12">
        <div class="card mb-4">
            <div class="card-header">Daftar Kabupaten</div>
            <div class="card-body position-relative p-4">
                <div class="row align-items-center mb-3 gx-2">
                    <!-- Search -->
                    <div class="col-md-4 col-lg-4 mb-2 mb-md-0">
                        <div class="input-group">
                            <span class="input-group-text">
                                <svg class="icon">
                                    <use xlink:href="vendors/@coreui/icons/svg/free.svg#cil-search"></use>
                                </svg>
                            </span>

                            <input
                                    class="form-control table-params"
                                    type="text"
                                    name="search"
                                    placeholder="Cari kode / nama kabupaten"
                                    value="{{ params.search | default('') }}"
                                    hx-get="/wilayah/kabupaten/table"
                                    hx-target="#table-container"
                                    hx-trigger="keyup changed delay:400ms"
                                    hx-push-url="false"
                                    hx-include=".table-params, .table-sort"
                            >
                        </div>
                    </div>

                    <!-- Filter Provinsi -->
                    <div class="col-md-4 col-lg-3 mb-2 mb-md-0">
                        <select
                                class="form-select table-params"
                                name="provinsiId"
                                hx-get="/wilayah/kabupaten/table"
                                hx-target="#table-container"
                                hx-trigger="change"
                                hx-push-url="false"
                                hx-include=".table-params, .table-sort"
                        >
                            {% for provinsi in provinsiList %}
                            <option
                                    value="{{ provinsi.id }}"
                                    {% if selectedProvinsiId == provinsi.id %}selected{% endif %}
                            >
                                {{ provinsi.nama }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="col-md-4 col-lg-4 text-md-end text-lg-end">
                        <!-- Tombol Tambah -->
                        <button type="button"
                                class="btn btn-primary"
                                hx-get="/wilayah/kabupaten/form?mode=add"
                                hx-include=".table-params"
                                hx-target="#form-container"
                                hx-trigger="click"
                                data-coreui-toggle="modal"
                                data-coreui-target="#kabupatenModal">
                            <svg class="icon me-2">
                                <use xlink:href="vendors/@coreui/icons/svg/free.svg#cil-plus"></use>
                            </svg>
                            Tambah
                        </button>
                    </div>

                    <!-- Page Size -->
                    <div class="col-md-4 col-lg-1 mb-2 mb-md-0">
                        <select class="form-select table-params"
                                name="pageSize"
                                hx-get="/wilayah/kabupaten/table"
                                hx-target="#table-container"
                                hx-trigger="change"
                                hx-push-url="false"
                                hx-include=".table-params, .table-sort">

                            <option value="5"  {% if params.pageSize == 5 %}selected{% endif %}>5</option>
                            <option value="10" {% if params.pageSize == 10 %}selected{% endif %}>10</option>
                            <option value="25" {% if params.pageSize == 25 %}selected{% endif %}>25</option>
                        </select>
                    </div>
                </div>
                <div id="table-container"
                     hx-get="/wilayah/kabupaten/table"
                     hx-trigger="kabupaten-saved from:body, kabupaten-deleted from:body"
                     hx-swap="innerHTML"
                     hx-include=".table-params">
                    {% include "pages/wilayah/fragments/kabupaten-table.html" %}
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Modal -->
<div class="modal fade" id="kabupatenModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Form Kabupaten</h5>
                <button class="btn-close" type="button" data-coreui-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="form-container">
                <!-- HTMX load form here -->
            </div>
        </div>
    </div>
</div>
<script>
    document.body.addEventListener("kabupaten-saved", (e) => {
        coreui.Modal
            .getInstance(document.getElementById("kabupatenModal"))
            .hide()
        showToast(e.detail.message, e.detail.type);
    })
    document.getElementById("kabupatenModal")
        .addEventListener("hidden.coreui.modal", () => {
            document.getElementById("form-container").innerHTML = ""
        })
    document.body.addEventListener("kabupaten-deleted", (e) => {
        showToast(e.detail.message, e.detail.type);
    })
</script>
{% endblock %}
