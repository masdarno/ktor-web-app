<select
        class="form-select table-params"
        name="kabupatenId"
        id="filterKabupatenId"
        hx-get="/wilayah/kelurahan/filter-kecamatan"
        hx-target="#kecamatanFilterWrapper"
        hx-swap="innerHTML"
        hx-trigger="{% if autoLoad %}load, {% endif %}change"
        hx-push-url="false"
>
  {% if kabupatenList is empty %}
  <option value="">-- Tidak ada kabupaten --</option>
  {% endif %}
  {% for kabupaten in kabupatenList %}
  <option value="{{ kabupaten.id }}" {% if selectedKabupatenId == kabupaten.id %}selected{% endif %}>
    {{ kabupaten.nama }}
  </option>
  {% endfor %}
</select>
