<!-- Modal PDF Report -->
<div class="modal fade" id="{{ pdfModalId | default('pdfModal') }}" tabindex="-1">
    <div class="modal-dialog modal-xl modal-dialog-centered">
        <div class="modal-content" style="height: 90vh;">

            <div class="modal-header">
                <h5 class="modal-title">{{ pdfModalTitle }}</h5>
                <button class="btn-close" type="button" data-coreui-dismiss="modal"></button>
            </div>

            <div class="modal-body p-0 position-relative">
                <div class="pdf-loading position-absolute top-0 start-0 w-100 h-100
                            d-flex flex-column justify-content-center align-items-center bg-body"
                     style="z-index: 10;">
                    <div class="spinner-border mb-3" role="status" aria-hidden="true"></div>
                    <div class="fw-semibold">Sedang menyiapkan laporan PDF...</div>
                    <small class="text-body-secondary mt-1">Mohon tunggu sebentar</small>
                </div>

                <div class="pdf-error position-absolute top-0 start-0 w-100 h-100
                            d-none flex-column justify-content-center align-items-center bg-body"
                     style="z-index: 9;">
                    <div class="text-danger mb-2">Gagal menampilkan laporan PDF.</div>
                    <small class="text-body-secondary">Silakan tutup lalu coba lagi.</small>
                </div>

                <iframe class="pdf-frame" src="" title="{{ pdfModalTitle }}"
                        style="width:100%; height:100%; border:none;"></iframe>
            </div>
        </div>
    </div>
</div>
